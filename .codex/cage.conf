# Sourced by ./codex. Extra directory trees the Landlock cage leaves writable, on top of
# this folder. Everything else on the filesystem is read/execute only.
CAGE_RW=(
  /tmp                    # scratch for Codex, Chromium profiles, Ghidra logs
  /dev/shm                # Chromium shared memory
  /root/.config/ghidra    # Ghidra user settings/projects (Java user.home is /root)
)
# TCP policy for the whole tree: "open" (default) or "restricted" (only the router port).
# Chromium and Ghidra need open; override per run with CODEX_NET=restricted.
CAGE_NET="${CODEX_NET:-open}"
